<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dsh-memory 记忆库</title>
<style>
  :root { color-scheme: light dark; --line:#8883; --dim:#888; --accent:#3b82f6; --danger:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 12px 96px; font:15px/1.55 -apple-system,"Noto Sans CJK SC",system-ui,sans-serif; }
  h1 { font-size:17px; margin:4px 0 2px; }
  .dim { color:var(--dim); font-size:12px; word-break:break-all; }
  .card { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:10px 0; }
  textarea, input, select { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:transparent; color:inherit; }
  textarea { min-height:76px; resize:vertical; }
  button { font:inherit; padding:7px 13px; border-radius:9px; border:1px solid var(--line); background:transparent; color:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--danger); border-color:var(--danger); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > * { flex:1; }
  .row > button { flex:0 0 auto; }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar input { flex:1; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border:1px solid var(--line); border-radius:999px; margin-right:5px; }
  .meta { margin-top:6px; }
  .body { white-space:pre-wrap; word-break:break-word; margin:6px 0 8px; }
  .sticky { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:Canvas; border-top:1px solid var(--line); display:flex; gap:8px; }
  .hidden { display:none; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:78px; background:#000c; color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>dsh-memory 记忆库</h1>
<div class="dim" id="head">加载中…</div>

<div class="card">
  <div class="row" style="margin-bottom:8px">
    <select id="kind">
      <option value="fact">fact 事实</option>
      <option value="preference">preference 偏好</option>
      <option value="rule">rule 规则</option>
      <option value="note" selected>note 备注</option>
    </select>
    <input id="tags" placeholder="标签，逗号分隔（可空）">
  </div>
  <textarea id="text" placeholder="要长期记住的内容，一句话一条"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="primary" id="save">保存新记忆</button>
    <button id="reload">刷新</button>
  </div>
</div>

<div class="bar">
  <input id="q" placeholder="搜索记忆…（空格分隔多词，全部命中）" inputmode="search">
</div>

<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var BASE = "__BASE__", KEY = "__KEY__";
  var items = [], editing = null, TOTAL = 0;
  var $ = function (id) { return document.getElementById(id); };

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function api(method, body) {
    var opt = { method: method, headers: { "x-memory-key": KEY } };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(BASE + "/api", opt).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function fmtDate(s) {
    if (!s) return "";
    var d = new Date(s);
    if (isNaN(d)) return s;
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")
      + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var shown = items.filter(function (m) {
      var hay = (m.text + " " + (m.tags || []).join(" ")).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    $("head").textContent = "共 " + TOTAL + " 条"
      + (TOTAL > items.length ? "（只显示最近 " + items.length + " 条）" : "")
      + (terms.length ? "，匹配 " + shown.length + " 条" : "")
      + " · " + "__STORE__" + " · 保存即生效";
    var list = $("list");
    list.textContent = "";
    if (!shown.length) {
      var p = document.createElement("p");
      p.className = "dim";
      p.textContent = items.length ? "没有匹配的记忆。" : "记忆库还是空的，在上面写第一条吧。";
      list.appendChild(p);
      return;
    }
    shown.slice().reverse().forEach(function (m) {
      var card = document.createElement("div"); card.className = "card";
      var top = document.createElement("div");
      var b = document.createElement("span"); b.className = "badge"; b.textContent = m.kind || "note";
      top.appendChild(b);
      var when = document.createElement("span"); when.className = "dim";
      when.textContent = fmtDate(m.updatedAt || m.createdAt) + (m.updatedAt && m.updatedAt !== m.createdAt ? "（改过）" : "");
      top.appendChild(when);
      card.appendChild(top);

      if (editing === m.id) {
        var ta = document.createElement("textarea"); ta.value = m.text; ta.id = "edit-text";
        var ti = document.createElement("input"); ti.value = (m.tags || []).join(","); ti.id = "edit-tags";
        var ks = document.createElement("select"); ks.id = "edit-kind";
        ["fact", "preference", "rule", "note"].forEach(function (k) {
          var o = document.createElement("option"); o.value = k; o.textContent = k;
          if ((m.kind || "note") === k) o.selected = true;
          ks.appendChild(o);
        });
        card.appendChild(ta);
        var row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
        row.appendChild(ti); row.appendChild(ks);
        var saveBtn = document.createElement("button"); saveBtn.className = "primary"; saveBtn.textContent = "保存";
        saveBtn.onclick = function () {
          api("POST", { action: "update", id: m.id, text: ta.value, tags: ti.value, kind: ks.value })
            .then(function () { editing = null; toast("已保存"); load(); })
            .catch(function (e) { toast("保存失败：" + e.message); });
        };
        var cancel = document.createElement("button"); cancel.textContent = "取消";
        cancel.onclick = function () { editing = null; render(); };
        row.appendChild(saveBtn); row.appendChild(cancel);
        card.appendChild(row);
      } else {
        var body = document.createElement("div"); body.className = "body"; body.textContent = m.text;
        card.appendChild(body);
        if (m.tags && m.tags.length) {
          var tags = document.createElement("div"); tags.className = "meta";
          m.tags.forEach(function (t) { var s = document.createElement("span"); s.className = "badge"; s.textContent = "#" + t; tags.appendChild(s); });
          card.appendChild(tags);
        }
        var actions = document.createElement("div"); actions.className = "row"; actions.style.marginTop = "8px";
        var edit = document.createElement("button"); edit.textContent = "编辑";
        edit.onclick = function () { editing = m.id; render(); };
        var del = document.createElement("button"); del.className = "danger"; del.textContent = "删除";
        del.onclick = function () {
          if (!confirm("删除这条记忆？\n\n" + m.text)) return;
          api("POST", { action: "forget", id: m.id })
            .then(function () { toast("已删除"); load(); })
            .catch(function (e) { toast("删除失败：" + e.message); });
        };
        actions.appendChild(edit); actions.appendChild(del);
        card.appendChild(actions);
      }
      var idline = document.createElement("div"); idline.className = "dim"; idline.textContent = m.id;
      card.appendChild(idline);
      list.appendChild(card);
    });
  }

  function load() {
    api("GET").then(function (j) {
      items = j.memories || [];
      TOTAL = j.total || items.length;
      render();
    }).catch(function (e) { $("head").textContent = "读取失败：" + e.message; });
  }

  $("save").onclick = function () {
    var text = $("text").value.trim();
    if (!text) { toast("内容不能为空"); return; }
    api("POST", { action: "save", text: text, tags: $("tags").value, kind: $("kind").value })
      .then(function (r) {
        $("text").value = "";
        toast(r.saved === false ? "内容重复，已更新时间" : "已保存");
        load();
      })
      .catch(function (e) { toast("保存失败：" + e.message); });
  };
  $("reload").onclick = load;
  $("q").oninput = render;
  load();
})();
</script>
</body>
</html>
